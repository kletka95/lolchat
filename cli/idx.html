<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Chat Test</title>
</head>
<body>
  <h1>WebSocket Chat</h1>
  <h4 id="mylogin"> </h4>
  <div id="messages" style="border: 1px solid #ccc; height: 200px; overflow-y: scroll; padding: 5px;"></div>
  <select name="msgType" id="msgType">
    <option value="public">public</option>
    <option value="private">private</option>
  </select>
  
  <textarea
  id="messageInput"
  placeholder="Type your message..."
  rows="3"
  style="width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; resize: vertical; box-sizing: border-box;"
></textarea>
  
  <button id="sendButton">Send</button>
  
  <div>
  <select name="users" id="userSelect">
  <!-- сюда будут добавляться опции -->
  </select>
  <button id="refreshButton">Refresh</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers/dist/sodium-wrappers.js"></script>
  <script src="cli.js"></script>
</body>
</html>
